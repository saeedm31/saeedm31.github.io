- layout: left
  name: TreadCast
  link: sh-treadcast.streamlit.app
  github: saeedm31/TreadCast
  quote: >
    How much tread is left on each truck tire, and how many km until it must be changed?
  description: | # this will include new lines to allow paragraphs
    From an in-tire acceleration sensor: physics features, a 1D CNN (PyTorch), gradient boosting and a per-tire Kalman filter. Simulated fleet with honest hold-out testing; Docker images for training and serving, live Streamlit app.

- layout: left
  name: Bank KPI Assistant
  link: sh-bank-kpi-assistant.streamlit.app
  github: saeedm31/bank-kpi-assistant
  quote: >
    Ask a bank's data a question in plain English and get the number, a chart and the working.
  description: | # this will include new lines to allow paragraphs
    Talk-to-your-database assistant on live (simulated) bank data: agreed KPI definitions, read-only SQL guard, alerts for unusual activity, and an optional AI mode (Claude, OpenAI or Ollama). 40/40 on its test questions; declines what it can't answer. Live Streamlit app.

- layout: left
  name: Card Fraud Detection
  link: sh-card-fraud-detection.streamlit.app
  github: saeedm31/card-fraud-detection
  quote: >
    Which card payments are fraud, why, and how many alerts are worth reviewing?
  description: | # this will include new lines to allow paragraphs
    Gradient boosting on behavioural features, with plain-language reasons for every alert and a threshold chosen by money saved. Catches 86% of fraud with 9 alerts a day on simulated data; PR-AUC 0.81 on the real ULB card dataset. Live Streamlit app.

- layout: left
  name: Energy Demand Forecast
  link: github.com/saeedm31/energy-demand-forecast
  github: saeedm31/energy-demand-forecast
  quote: >
    How much electricity will this home use in the next 14 days, and how sure are we?
  description: | # this will include new lines to allow paragraphs
    Gradient boosting with conformal 80% intervals on 4 years of smart-meter data. 30% better than the baseline in a 52-week rolling backtest. MLflow tracking, Flask API, Docker.

- layout: left
